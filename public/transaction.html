<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Make Transaction | Fintech</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="navbar">
      <h2>Fintech Dashboard</h2>
      <div class="nav-links">
        <a href="/dashboard.html" class="btn-secondary">← Back to Dashboard</a>
      </div>
    </div>

    <div class="container wide-container" style="max-width: 480px">
      <h2>Perform Transaction</h2>
      <div id="alertBox" class="alert"></div>

      <form id="txForm">
        <div class="form-group">
          <label>Transaction Type</label>
          <select id="type" required>
            <option value="credit">Credit (Deposit money)</option>
            <option value="debit">Debit (Withdraw money)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Amount (₦)</label>
          <input
            type="number"
            id="amount"
            min="1"
            required
            placeholder="5000"
          />
        </div>

        <div class="form-group">
          <label>Description (Optional)</label>
          <input
            type="text"
            id="description"
            placeholder="e.g. Salary, Groceries"
          />
        </div>

        <button type="submit" class="btn-primary">Submit Transaction</button>
      </form>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/transaction.js"></script>
  </body>
</html>
