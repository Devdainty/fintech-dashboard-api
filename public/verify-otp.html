<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Verify Email OTP | Fintech</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Verify Email</h2>
      <p
        style="
          text-align: center;
          margin-bottom: 20px;
          font-size: 14px;
          color: #64748b;
        "
      >
        Check your email inbox or backend console for your 6-digit OTP code.
      </p>
      <div id="alertBox" class="alert"></div>

      <form id="otpForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group">
          <label>6-Digit OTP</label>
          <input
            type="text"
            id="otp"
            maxlength="6"
            required
            placeholder="123456"
          />
        </div>
        <button type="submit" class="btn-primary">Verify OTP</button>
      </form>

      <p class="link-text">Back to <a href="/login.html">Login</a></p>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/verify-otp.js"></script>
  </body>
</html>
